name: API health

# The private API this package wraps changes without notice: the facet section list and two
# attribute display names both moved on 2026-09-02 while the package was being written
# (docs/01-api-spec.md sections 4.4 and 4.5). This job notices within six hours.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Health check
        id: health
        run: python scripts/health_check.py --json health.json --markdown | tee health.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: |
            health.json
            health.md

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'The health check failed and produced no report.';
            try {
              body = fs.readFileSync('health.md', 'utf8');
            } catch (err) {
              core.warning(`no health.md: ${err}`);
            }
            const title = `API health check failed (${new Date().toISOString().slice(0, 10)})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'api-health',
            });
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `${body}\n\n[run](${run})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `${body}\n\n[run](${run})`,
                labels: ['api-health'],
              });
            }
